<div class="container" id="i18_metrics">
  <div class="row">
    <div class="col-lg-12 text-center">
      <div class="navy-line"></div>
      <h1>
        <span data-i18n="metric.my_metric"
          >Key Technical Impacts & Metrics</span
        >
        <span class="metrics-as-of">(as of Jan 2025)</span>
      </h1>
    </div>
  </div>
  <div class="row features-block">
    <div class="col-lg-12">
      <div
        id="vertical-timeline"
        class="vertical-container light-timeline timeline-full"
      >
        {% for metric in site.data.index.metrics%}
        <div class="vertical-timeline-block">
          <div class="vertical-timeline-icon navy-bg-present wow rotateIn">
            <i class="fa {{ metric.icon }}"></i>
          </div>
          <div class="vertical-timeline-content wow fadeInUp">
            <h2>
              <span data-i18n="metric.{{ metric.title.i18n }}"
                >{{ metric.title | markdownify}}</span
              >
            </h2>
            {% for item in metric.items %}
            <p>
              <span data-i18n="metric.{{ item.i18n }}"
                >{{ item | markdownify }}</span
              >
            </p>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
