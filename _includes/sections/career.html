<div class="container" id="i18_career">
  <div class="row">
    <div class="col-lg-12 text-center">
      <div class="navy-line"></div>
      <h1><span data-i18n="career.my_career">My Career</span></h1>
    </div>
  </div>
  <div class="row features-block">
    <div class="col-lg-12">
      <div
        id="vertical-timeline"
        class="vertical-container light-timeline timeline-full"
      >
        {% for career in site.data.index.careers %}
        <div class="vertical-timeline-block">
          <div
            class="vertical-timeline-icon {% if career.present == true %} navy-bg-present {% else %} navy-bg {% endif %} wow rotateIn"
          >
            <i class="fa {{ career.icon }}"></i>
          </div>
          <div class="vertical-timeline-content wow fadeInUp">
            <header class="timeline-item-header">
              <span class="vertical-date"
                ><span data-i18n="career.{{ career.date.i18n }}"
                  >{{ career.date.detail }}</span
                ></span
              >
              <h2>
                <span data-i18n="career.{{ career.name.i18n }}"
                  >{{ career.name.detail }}</span
                >
              </h2>
            </header>
            <p>
              <span data-i18n="career.{{ career.desc.i18n }}"
                >{{ career.desc.detail }}</span
              >
            </p>
            <p class="career-role">
              <small
                ><span data-i18n="career.{{ career.job.i18n }}"
                  >{{ career.job.detail }}</span
                ></small
              >
            </p>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
