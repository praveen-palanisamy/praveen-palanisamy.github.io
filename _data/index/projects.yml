- name: Tensorflow-2-Reinforcement-Learning-Cookbook
  gh_user: PacktPublishing
  repo: Tensorflow-2-Reinforcement-Learning-Cookbook
  img: tf2rl-cookbook.png
  desc: This book contains easy-to-follow recipes for leveraging **TensorFlow 2.x** to develop artificial intelligence applications. Starting with an introduction to the fundamentals of **deep reinforcement learning** and TensorFlow 2.x, the book covers **OpenAI Gym**, **model-based RL**, **model-free RL**, and how to develop basic agents. You'll discover how to implement advanced deep reinforcement learning algorithms such as **actor-critic**, **deep deterministic policy gradients**, **deep-Q networks**, **proximal policy optimization**, and **deep recurrent Q-networks** for training your RL agents. As you advance, you’ll explore the applications of reinforcement learning by building **cryptocurrency trading agents**, **stock/share trading agents**, and intelligent **agents for automating task completion**. Finally, you'll find out how to **deploy deep reinforcement learning agents to the cloud** and **build cross-platform apps** using TensorFlow 2.x.

